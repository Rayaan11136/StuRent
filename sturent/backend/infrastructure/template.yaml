AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: StuRent API — API Gateway, Lambda, DynamoDB, Bedrock explain

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 20
    MemorySize: 512
    Architectures:
      - x86_64
    Environment:
      Variables:
        TABLE_PROPERTIES: !Ref PropertiesTable
        TABLE_USERS: !Ref UsersTable
        TABLE_NEARBY: !Ref NearbyTable
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        CORS_ORIGIN: "*"
    Tracing: Active

Parameters:
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
  StageName:
    Type: String
    Default: prod

Resources:
  PropertiesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: StuRentProperties
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: propertyId
          AttributeType: S
      KeySchema:
        - AttributeName: propertyId
          KeyType: HASH

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: StuRentUsers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  NearbyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: StuRentNearby
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: nearbyId
          AttributeType: S
        - AttributeName: propertyId
          AttributeType: S
      KeySchema:
        - AttributeName: nearbyId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: propertyId-index
          KeySchema:
            - AttributeName: propertyId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  StuRentApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  GetPropertiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sturent-get-properties
      CodeUri: ../
      Handler: functions/getProperties/index.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PropertiesTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref StuRentApi
            Path: /properties
            Method: GET

  GetPropertyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sturent-get-property
      CodeUri: ../
      Handler: functions/getProperty/index.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PropertiesTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref StuRentApi
            Path: /properties/{propertyId}
            Method: GET

  MatchPropertiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sturent-match
      CodeUri: ../
      Handler: functions/matchProperties/index.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PropertiesTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref StuRentApi
            Path: /match
            Method: POST

  ExplainMatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sturent-explain-match
      CodeUri: ../
      Handler: functions/explainMatch/index.handler
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref StuRentApi
            Path: /explain-match
            Method: POST

  GetNearbyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sturent-get-nearby
      CodeUri: ../
      Handler: functions/getNearby/index.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref NearbyTable
        - DynamoDBReadPolicy:
            TableName: !Ref PropertiesTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref StuRentApi
            Path: /properties/{propertyId}/nearby
            Method: GET

Outputs:
  ApiUrl:
    Description: API Gateway base URL for VITE_API_BASE_URL
    Value: !Sub "https://${StuRentApi}.execute-api.${AWS::Region}.amazonaws.com"
  PropertiesTableName:
    Value: !Ref PropertiesTable
  NearbyTableName:
    Value: !Ref NearbyTable
